<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dance Division — Script</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #11110f;
      --paper: #eeeae1;
      --paper-dark: #e3ded3;
      --ink: #171714;
      --muted: #77746c;
      --line: rgba(20,20,18,.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--paper);
    }

    body {
      font-family: "Manrope", sans-serif;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 32px;

      z-index: 100;
      pointer-events: none;
    }

    .wordmark,
    .header-right {
      pointer-events: auto;
    }

    .wordmark {
      color: var(--paper);
      text-decoration: none;

      font-family: "DM Mono", monospace;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .draft {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .close {
      color: var(--paper);
      text-decoration: none;

      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;

      transition: opacity .25s ease;
    }

    .close:hover {
      opacity: .5;
    }


    /* =========================================================
       VIEWER
    ========================================================= */

    .viewer {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 90px 70px 100px;

      perspective: 2200px;
    }


    /* =========================================================
       BOOK
    ========================================================= */

    .book {
      position: relative;

      width: min(1100px, 86vw);
      height: min(760px, 78vh);

      display: flex;

      transform-style: preserve-3d;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      position: absolute;

      top: 0;
      width: 50%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,.035),
          transparent 7%,
          transparent 93%,
          rgba(0,0,0,.035)
        ),
        var(--paper);

      color: var(--ink);

      overflow: hidden;

      box-shadow:
        0 30px 70px rgba(0,0,0,.35);

      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .page-left {
      left: 0;

      border-right: 1px solid rgba(0,0,0,.12);

      transform-origin: right center;

      z-index: 1;
    }

    .page-right {
      right: 0;

      border-left: 1px solid rgba(0,0,0,.12);

      transform-origin: left center;

      z-index: 2;
    }


    /* =========================================================
       PAGE CONTENT
    ========================================================= */

    .page-inner {
      width: 100%;
      height: 100%;

      padding: 55px 58px;

      display: flex;
      flex-direction: column;
    }

    .page-number {
      font-family: "DM Mono", monospace;
      font-size: 9px;
      letter-spacing: .12em;
      color: var(--muted);
    }

    .page-content {
      margin-top: 45px;

      font-size: 14px;
      line-height: 1.7;
    }

    .page-content h1 {
      margin: 0 0 40px;

      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 3vw, 46px);
      font-weight: 400;
      line-height: 1.05;
    }

    .page-content h2 {
      margin: 0 0 25px;

      font-family: "DM Mono", monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .page-content p {
      margin: 0 0 18px;
    }

    .scene {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;

      margin: 26px 0 14px;
    }

    .character {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;

      margin: 24px 0 5px;
    }

    .dialogue {
      max-width: 82%;
      margin-left: 30px;
    }


    /* =========================================================
       PAGE TURN
    ========================================================= */

    .page.turn-forward {
      animation: turnForward .75s cubic-bezier(.22,.61,.36,1) forwards;
    }

    .page.turn-back {
      animation: turnBack .75s cubic-bezier(.22,.61,.36,1) forwards;
    }

    @keyframes turnForward {

      0% {
        transform: rotateY(0deg);
      }

      100% {
        transform: rotateY(-180deg);
      }

    }

    @keyframes turnBack {

      0% {
        transform: rotateY(-180deg);
      }

      100% {
        transform: rotateY(0deg);
      }

    }


    /* =========================================================
       PAGE SHADOW
    ========================================================= */

    .page::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          transparent 70%,
          rgba(0,0,0,.13)
        );

      opacity: 0;
      transition: opacity .2s;
    }

    .page.turn-forward::after {
      opacity: 1;
    }


    /* =========================================================
       CONTROLS
    ========================================================= */

    .controls {
      position: fixed;

      bottom: 28px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 22px;

      z-index: 100;
    }

    .control {
      appearance: none;
      border: 0;
      background: none;

      color: var(--paper);

      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;

      cursor: pointer;

      padding: 8px;

      opacity: .7;

      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .control:hover {
      opacity: 1;
    }

    .control:active {
      transform: scale(.94);
    }

    .control:disabled {
      opacity: .2;
      cursor: default;
    }

    .counter {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .1em;

      color: var(--muted);

      min-width: 70px;
      text-align: center;
    }


    /* =========================================================
       CLICK ZONES
    ========================================================= */

    .click-zone {
      position: fixed;
      top: 80px;
      bottom: 80px;

      width: 25%;

      z-index: 50;

      cursor: pointer;
    }

    .click-left {
      left: 0;
    }

    .click-right {
      right: 0;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .header {
        height: 58px;
        padding: 0 18px;
      }

      .draft {
        display: none;
      }

      .viewer {
        padding: 75px 18px 80px;
      }

      .book {
        width: min(92vw, 520px);
        height: min(78vh, 720px);
      }

      .page {
        width: 100%;
      }

      .page-left {
        display: none;
      }

      .page-right {
        left: 0;
        right: auto;

        transform-origin: left center;
      }

      .page-inner {
        padding: 38px 30px;
      }

      .page-content {
        margin-top: 35px;

        font-size: 13px;
        line-height: 1.65;
      }

      .page-content h1 {
        font-size: 34px;
      }

      .dialogue {
        max-width: 88%;
        margin-left: 20px;
      }

      .click-zone {
        width: 35%;
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .page.turn-forward,
      .page.turn-back {
        animation-duration: .01ms;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header class="header">

    <a href="index.html" class="wordmark">
      DANCE DIVISION
    </a>

    <div class="header-right">

      <span class="draft">
        DRAFT 03
      </span>

      <a href="index.html" class="close">
        CLOSE
      </a>

    </div>

  </header>


  <!-- =======================================================
       VIEWER
  ======================================================== -->

  <main class="viewer">

    <div class="book">

      <!-- PAGE -->
      <article class="page page-right" id="currentPage">

        <div class="page-inner">

          <div class="page-number" id="pageNumber">
            01
          </div>

          <div class="page-content" id="pageContent">

            <h1>
              DANCE<br>
              DIVISION
            </h1>

            <p>
              A vertical narrative series.
            </p>

            <p>
              In development.
            </p>

          </div>

        </div>

      </article>

    </div>

  </main>


  <!-- =======================================================
       CLICK AREAS
  ======================================================== -->

  <div
    class="click-zone click-left"
    id="clickLeft">
  </div>

  <div
    class="click-zone click-right"
    id="clickRight">
  </div>


  <!-- =======================================================
       CONTROLS
  ======================================================== -->

  <div class="controls">

    <button
      class="control"
      id="previous">
      ← PREV
    </button>

    <div
      class="counter"
      id="counter">
      01 / 08
    </div>

    <button
      class="control"
      id="next">
      NEXT →
    </button>

  </div>


  <script>

    /* =========================================================
       SCRIPT PAGES

       Add/edit the pages here.
       Each object becomes one "page" in the book.
    ========================================================= */

    const pages = [

      {
        number: "01",
        content: `
          <h1>
            DANCE<br>
            DIVISION
          </h1>

          <p>
            A vertical narrative series.
          </p>

          <p>
            In development.
          </p>
        `
      },


      {
        number: "02",
        content: `
          <div class="scene">
            01 — INTERIOR
          </div>

          <p>
            The room is almost empty.
          </p>

          <p>
            A body enters the frame.
          </p>

          <p>
            It does not appear to be performing.
          </p>

          <p>
            It appears to be remembering.
          </p>
        `
      },


      {
        number: "03",
        content: `
          <div class="character">
            SHE
          </div>

          <div class="dialogue">
            <p>
              Do you remember this?
            </p>
          </div>

          <div class="character">
            HE
          </div>

          <div class="dialogue">
            <p>
              I remember the room.
            </p>
          </div>
        `
      },


      {
        number: "04",
        content: `
          <div class="scene">
            02 — MOVEMENT STUDY
          </div>

          <p>
            The camera remains fixed.
          </p>

          <p>
            The body moves through the space,
            entering and leaving the frame.
          </p>

          <p>
            We never see the complete movement.
          </p>
        `
      },


      {
        number: "05",
        content: `
          <h2>
            CAMERA
          </h2>

          <p>
            Static compositions.
          </p>

          <p>
            Long observation.
          </p>

          <p>
            Movement is allowed to happen
            at the edge of the frame.
          </p>

          <p>
            The camera does not chase.
          </p>
        `
      },


      {
        number: "06",
        content: `
          <div class="scene">
            03 — NIGHT
          </div>

          <p>
            Darkness outside the windows.
          </p>

          <p>
            The room becomes a stage.
          </p>

          <p>
            Someone begins to dance.
          </p>
        `
      },


      {
        number: "07",
        content: `
          <div class="character">
            SHE
          </div>

          <div class="dialogue">
            <p>
              Maybe the body knows before we do.
            </p>
          </div>

          <p>
            Silence.
          </p>

          <p>
            She continues.
          </p>
        `
      },


      {
        number: "08",
        content: `
          <h1>
            THE BODY<br>
            REMEMBERS
          </h1>

          <p>
            What the camera forgets.
          </p>

          <br>

          <p>
            DANCE DIVISION
          </p>

          <p>
            A VERTICAL NARRATIVE SERIES
          </p>

          <p>
            2026
          </p>
        `
      }

    ];


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const page = document.getElementById("currentPage");
    const pageNumber = document.getElementById("pageNumber");
    const pageContent = document.getElementById("pageContent");

    const counter = document.getElementById("counter");

    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    const clickLeft = document.getElementById("clickLeft");
    const clickRight = document.getElementById("clickRight");


    let currentPage = 0;
    let isTurning = false;


    /* =========================================================
       RENDER
    ========================================================= */

    function renderPage() {

      pageNumber.textContent =
        pages[currentPage].number;

      pageContent.innerHTML =
        pages[currentPage].content;

      counter.textContent =
        `${String(currentPage + 1).padStart(2, "0")} / ${String(pages.length).padStart(2, "0")}`;

      previous.disabled =
        currentPage === 0;

      next.disabled =
        currentPage === pages.length - 1;

    }


    /* =========================================================
       NEXT PAGE
    ========================================================= */

    function nextPage() {

      if (
        isTurning ||
        currentPage >= pages.length - 1
      ) {
        return;
      }

      isTurning = true;

      page.classList.remove("turn-back");

      /*
        Start page turn.
      */

      page.classList.add("turn-forward");

      setTimeout(() => {

        currentPage++;

        /*
          Reset the page instantly while
          it is hidden behind the rotation.
        */

        page.classList.remove("turn-forward");

        renderPage();

        isTurning = false;

      }, 650);

    }


    /* =========================================================
       PREVIOUS PAGE
    ========================================================= */

    function previousPage() {

      if (
        isTurning ||
        currentPage <= 0
      ) {
        return;
      }

      isTurning = true;

      page.classList.add("turn-forward");

      setTimeout(() => {

        currentPage--;

        page.classList.remove("turn-forward");

        renderPage();

        isTurning = false;

      }, 650);

    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    next.addEventListener(
      "click",
      nextPage
    );

    previous.addEventListener(
      "click",
      previousPage
    );


    /* =========================================================
       CLICK AREAS
    ========================================================= */

    clickRight.addEventListener(
      "click",
      nextPage
    );

    clickLeft.addEventListener(
      "click",
      previousPage
    );


    /* =========================================================
       KEYBOARD
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (event.key === "ArrowRight") {
          nextPage();
        }

        if (event.key === "ArrowLeft") {
          previousPage();
        }

        if (event.key === "Escape") {
          window.location.href = "index.html";
        }

      }
    );


    /* =========================================================
       SWIPE
    ========================================================= */

    let touchStartX = 0;

    document.addEventListener(
      "touchstart",
      event => {

        touchStartX =
          event.touches[0].clientX;

      },
      { passive: true }
    );


    document.addEventListener(
      "touchend",
      event => {

        const touchEndX =
          event.changedTouches[0].clientX;

        const difference =
          touchStartX - touchEndX;

        if (Math.abs(difference) < 50) {
          return;
        }

        if (difference > 0) {
          nextPage();
        } else {
          previousPage();
        }

      },
      { passive: true }
    );


    /* =========================================================
       INITIALIZE
    ========================================================= */

    renderPage();

  </script>

</body>
</html>
